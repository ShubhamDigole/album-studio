<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0F3D3E" />
  <title>Photos</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F3D3E'/%3E%3Cpath d='M16 7c4 3 4 9 0 13-4-4-4-10 0-13z' fill='%23EFA00B'/%3E%3Crect x='7' y='24' width='18' height='2' fill='%23EFA00B'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/css/fonts.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/gallery.css" />
  <script src="assets/js/album-meta.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.4-7.5-10A4.3 4.3 0 0112 7.6 4.3 4.3 0 0119.5 10c0 5.6-7.5 10-7.5 10z"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-8-2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2zM12 6v14"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></symbol>
    </defs>
  </svg>

  <header class="hero silk">
    <div class="hero-inner">
      <div class="hero-top">
        <a class="studio" id="studio" target="_blank" rel="noopener"></a>
        <button class="icon-btn" id="themeBtn" title="Light background"><svg><use href="#i-sun"/></svg></button>
      </div>
      <h1 class="display" id="title">&nbsp;</h1>
      <p class="subtitle" id="subtitle"></p>
      <div class="hero-actions">
        <a class="btn" id="albumLink"><svg><use href="#i-book"/></svg>Open the album</a>
        <a class="btn quiet" id="downloadAll" target="_blank" rel="noopener" hidden><svg><use href="#i-download"/></svg>Download all photos</a>
      </div>
    </div>
    <div class="zari" aria-hidden="true"></div>
  </header>

  <nav class="filters" id="filters" aria-label="Show photos from"></nav>

  <main class="photos" id="photos" aria-live="polite"></main>

  <section class="blessings" id="blessings" hidden>
    <div class="blessings-inner">
      <div>
        <h2 class="display">Blessings</h2>
        <p class="lede">Leave a message for the couple. Everyone who opens this album can read it.</p>
        <form class="bless-form" id="blessForm">
          <label class="field"><span>Your name</span><input name="name" maxlength="60" autocomplete="name" required /></label>
          <label class="field"><span>Your message</span><textarea name="message" maxlength="1000" rows="4" required></textarea></label>
          <button class="btn" type="submit">Send blessing</button>
          <p class="form-note" id="blessNote" role="status"></p>
        </form>
      </div>
      <div>
        <ol class="bless-list" id="blessList"></ol>
        <button class="btn quiet" id="blessMore" hidden>Show older messages</button>
      </div>
    </div>
  </section>

  <footer class="foot" id="foot"></footer>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo">
    <div class="lb-top">
      <p class="lb-count" id="lbCount"></p>
      <div class="lb-actions">
        <button class="lb-btn heart" id="lbHeart" hidden><svg><use href="#i-heart"/></svg><span></span></button>
        <a class="lb-btn" id="lbDownload" title="Download this photo"><svg><use href="#i-download"/></svg><span>Download</span></a>
        <button class="lb-btn" id="lbClose" title="Close (Esc)"><svg><use href="#i-close"/></svg></button>
      </div>
    </div>
    <div class="lb-stage" id="lbStage"><img id="lbImg" alt="" /></div>
    <button class="lb-nav prev" id="lbPrev" aria-label="Previous photo"><svg><use href="#i-prev"/></svg></button>
    <button class="lb-nav next" id="lbNext" aria-label="Next photo"><svg><use href="#i-next"/></svg></button>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="assets/js/guestbook.js"></script>
  <script src="assets/js/gallery.js"></script>
</body>
</html>
