name = "wedding-album"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "album_db"
# Local development works with this placeholder. Before deploying, run
#   npx wrangler d1 create album_db
# and paste the database_id it prints here.
database_id = "00000000-0000-0000-0000-000000000000"

# Secrets (never commit them):
#   local:  put them in .dev.vars  (ALBUM_SECRET=..., ADMIN_PASSWORD=..., optional ALBUM_PASSWORD=...)
#   remote: npx wrangler pages secret put ALBUM_SECRET --project-name wedding-album   (same for the others)

# Uploaded photos, PDF pages and custom covers. Create once with:  node tools/cf.mjs r2 bucket create album-media
# (R2 must be enabled in the Cloudflare dashboard first; it is free up to 10 GB.)
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "album-media"
